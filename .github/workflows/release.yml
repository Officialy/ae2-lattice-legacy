# Push a tag like v1.0.1 -> build, then publish to GitHub Releases, Modrinth and CurseForge.
# The version comes from the tag; release notes come from that version's "## x.y.z" section in CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_PROJECT_ID: '1835183'
      # CurseForge game version ids: 1.20.1, Forge, Java 17, Client, Server
      CF_GAME_VERSIONS: '[9990, 7498, 8326, 9638, 9639]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version and release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1
          fi
          cat release-notes.md

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="$VERSION" --no-daemon
          JAR="build/libs/ae2lattice-1.20.1-$VERSION.jar"
          test -f "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$JAR" --title "Lattice $VERSION" --notes-file release-notes.md

      - name: Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth -Pmod_version="$VERSION" --no-daemon

      - name: CurseForge
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          jq -n --arg notes "$(cat release-notes.md)" --arg name "Lattice $VERSION" --argjson gv "$CF_GAME_VERSIONS" '{
            changelog: $notes, changelogType: "markdown", displayName: $name, releaseType: "release",
            gameVersions: $gv,
            relations: { projects: [
              { slug: "applied-energistics-2", type: "requiredDependency" },
              { slug: "emi", type: "optionalDependency" } ] }
          }' > cf-meta.json
          code=$(curl -s -o cf-response.txt -w '%{http_code}' \
            -H "X-Api-Token: $CF_TOKEN" \
            -F "metadata=<cf-meta.json" -F "file=@$JAR" \
            "https://minecraft.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")
          cat cf-response.txt; echo
          test "$code" = "200"
