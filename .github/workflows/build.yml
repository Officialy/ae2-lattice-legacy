name: Legacy CI
on:
  push:
    branches: [main, 'backport/**']
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'gtnhShared/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Apply GTNH source formatting
        run: |
          ./gradlew --no-daemon spotlessApply
          git diff --binary > "${RUNNER_TEMP}/gtnh-format.patch"
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Upload formatting patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtnh-format-patch
          path: ${{ runner.temp }}/gtnh-format.patch
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ae2-lattice-legacy-build
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/problems/
            build/reports/checkstyle/
          if-no-files-found: ignore
          retention-days: 7
